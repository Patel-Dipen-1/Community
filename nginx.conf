# Production Nginx Reverse Proxy Configuration for B2B Platform
# Supporting 5,000 active concurrent WebSocket & HTTP users

upstream b2b_api_backend {
    # Node.js PM2 cluster processes running locally on port 5000
    # Note: Socket.IO Redis Adapter handles cross-instance messaging, making sticky sessions optional.
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64; // Keepalive connection pool to Node.js backend
}

server {
    listen 80;
    server_name api.b2bplatform.com; // Replace with production domain

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.b2bplatform.com; // Replace with production domain

    # SSL Certificate Paths (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.b2bplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.b2bplatform.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum file upload size (50MB for video/media uploads)
    client_max_body_size 50M;

    # Serve Static Uploaded Images & Videos directly from disk (bypasses Node.js process)
    location /uploads/ {
        alias /var/www/b2b-platform/apps/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Endpoints Reverse Proxy
    location /api/ {
        proxy_pass http://b2b_api_backend;
        proxy_http_version 1.1;

        # Forward Client Real IP Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive & Timeout settings
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Socket.IO Real-Time WebSocket Endpoint
    location /socket.io/ {
        proxy_pass http://b2b_api_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeout settings (prevents disconnects on quiet connections)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
